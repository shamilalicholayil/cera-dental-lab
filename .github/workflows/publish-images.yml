name: Publish Production Images

on:
  workflow_dispatch:

  workflow_run:
    workflows:
      - Production Compose Check
    types:
      - completed

permissions:
  contents: read
  packages: write

concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  publish:
    name: Publish production images

    if: >
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'master' &&
        github.event.workflow_run.event == 'push'
      )

    runs-on: ubuntu-24.04

    env:
      REGISTRY: ghcr.io
      API_IMAGE: ghcr.io/${{ github.repository_owner }}/cera-dental-lab-api
      WEB_IMAGE: ghcr.io/${{ github.repository_owner }}/cera-dental-lab-web
      RELEASE_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

    steps:
      - name: Checkout release commit
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_SHA }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish API image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile.api
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.API_IMAGE }}:${{ env.RELEASE_SHA }}
            ${{ env.API_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Build and publish web image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile.web
          platforms: linux/amd64
          push: true
          build-args: |
            VITE_API_URL=/api/v1
          tags: |
            ${{ env.WEB_IMAGE }}:${{ env.RELEASE_SHA }}
            ${{ env.WEB_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Prepare SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          set -Eeuo pipefail

          install -m 700 -d ~/.ssh

          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/cera-production
          chmod 600 ~/.ssh/cera-production

          printf '%s %s %s\n' \
            "$EC2_HOST" \
            "ssh-ed25519" \
            "AAAAC3NzaC1lZDI1NTE5AAAAIAroUYhBoYcTme+Av/ovkrOnpo1h1so/lYZnujoZx+j6" \
            > ~/.ssh/known_hosts

          chmod 600 ~/.ssh/known_hosts

          echo "Verifying pinned EC2 host key..."

          ssh-keygen \
            -F "$EC2_HOST" \
            -f ~/.ssh/known_hosts \
            >/dev/null || {
              echo "Pinned EC2 host key was not written correctly."
              exit 1
            }

          echo "EC2 host key is pinned."

      - name: Upload production Compose definition
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          scp \
            -i ~/.ssh/cera-production \
            compose.production.yml \
            "${EC2_USER}@${EC2_HOST}:/opt/cera/compose.production.yml"

      - name: Deploy release to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          ssh \
            -i ~/.ssh/cera-production \
            "${EC2_USER}@${EC2_HOST}" \
            "RELEASE_SHA='${RELEASE_SHA}' bash -s" <<'REMOTE'
          set -Eeuo pipefail

          cd /opt/cera

          API_REPOSITORY="ghcr.io/shamilalicholayil/cera-dental-lab-api"
          WEB_REPOSITORY="ghcr.io/shamilalicholayil/cera-dental-lab-web"

          NEW_API_IMAGE="${API_REPOSITORY}:${RELEASE_SHA}"
          NEW_WEB_IMAGE="${WEB_REPOSITORY}:${RELEASE_SHA}"

          OLD_API_IMAGE="$(
            grep '^CERA_API_IMAGE=' .env |
              cut -d= -f2-
          )"

          OLD_WEB_IMAGE="$(
            grep '^CERA_WEB_IMAGE=' .env |
              cut -d= -f2-
          )"

          echo "Current API image: ${OLD_API_IMAGE}"
          echo "Current web image: ${OLD_WEB_IMAGE}"
          echo "Release SHA: ${RELEASE_SHA}"

          echo "Pulling release images..."

          docker pull "${NEW_API_IMAGE}"
          docker pull "${NEW_WEB_IMAGE}"

          cp .env .env.before-deploy

          sed -i \
            "s|^CERA_API_IMAGE=.*|CERA_API_IMAGE=${NEW_API_IMAGE}|" \
            .env

          sed -i \
            "s|^CERA_WEB_IMAGE=.*|CERA_WEB_IMAGE=${NEW_WEB_IMAGE}|" \
            .env

          deploy_failed=0

          docker compose \
            --env-file .env \
            -f compose.production.yml \
            config --quiet \
            || deploy_failed=1

          if [ "$deploy_failed" -eq 0 ]; then
            docker compose \
              --env-file .env \
              -f compose.production.yml \
              up -d \
              --wait \
              --wait-timeout 120 \
              || deploy_failed=1
          fi

          if [ "$deploy_failed" -eq 0 ]; then
            curl \
              --fail \
              --silent \
              --show-error \
              http://127.0.0.1:8080/api/v1/health \
              >/tmp/cera-health.json \
              || deploy_failed=1
          fi

          if [ "$deploy_failed" -ne 0 ]; then
            echo "Deployment failed. Rolling back."

            mv .env.before-deploy .env

            docker pull "${OLD_API_IMAGE}" || true
            docker pull "${OLD_WEB_IMAGE}" || true

            docker compose \
              --env-file .env \
              -f compose.production.yml \
              up -d \
              --wait \
              --wait-timeout 120

            echo "Rollback completed."
            exit 1
          fi

          rm -f .env.before-deploy

          echo "Deployment healthy:"
          cat /tmp/cera-health.json
          echo

          docker compose \
            --env-file .env \
            -f compose.production.yml \
            ps

          docker image prune -f
          REMOTE
