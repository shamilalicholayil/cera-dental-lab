name: Publish Production Images

on:
  workflow_dispatch:

  push:
    branches:
      - master
    paths:
      - "Dockerfile.api"
      - "Dockerfile.web"
      - ".dockerignore"
      - "compose.production.yml"
      - "docker/**"
      - "apps/api/**"
      - "apps/web/**"
      - "packages/shared/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/publish-images.yml"

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-images-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  API_IMAGE: ghcr.io/${{ github.repository_owner }}/cera-dental-lab-api
  WEB_IMAGE: ghcr.io/${{ github.repository_owner }}/cera-dental-lab-web

jobs:
  publish:
    name: Publish production images
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish API image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile.api
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.API_IMAGE }}:${{ github.sha }}
            ${{ env.API_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Build and publish web image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile.web
          platforms: linux/amd64
          push: true
          build-args: |
            VITE_API_URL=/api/v1
          tags: |
            ${{ env.WEB_IMAGE }}:${{ github.sha }}
            ${{ env.WEB_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Show published image tags
        run: |
          echo "Commit SHA: $GITHUB_SHA"
          echo "API image: $API_IMAGE:$GITHUB_SHA"
          echo "API image: $API_IMAGE:latest"
          echo "WEB image: $WEB_IMAGE:$GITHUB_SHA"
          echo "WEB image: $WEB_IMAGE:latest"
