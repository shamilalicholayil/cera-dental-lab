name: Production Compose Check

on:
  workflow_dispatch:

  pull_request:
    paths:
      - "Dockerfile.api"
      - "Dockerfile.web"
      - ".dockerignore"
      - "compose.production.yml"
      - "docker/**"
      - "deploy/api.production.env.example"
      - "apps/api/**"
      - "apps/web/**"
      - "packages/shared/**"
      - "package.json"
      - "package-lock.json"
      - ".github/compose.ci.yml"
      - ".github/workflows/docker-compose-check.yml"

  push:
    branches:
      - master
    paths:
      - "Dockerfile.api"
      - "Dockerfile.web"
      - ".dockerignore"
      - "compose.production.yml"
      - "docker/**"
      - "deploy/api.production.env.example"
      - "apps/api/**"
      - "apps/web/**"
      - "packages/shared/**"
      - "package.json"
      - "package-lock.json"
      - ".github/compose.ci.yml"
      - ".github/workflows/docker-compose-check.yml"

permissions:
  contents: read

env:
  CERA_API_IMAGE: cera-api:ci
  CERA_WEB_IMAGE: cera-web:ci
  CERA_API_ENV_FILE: ./.ci/api.env
  CERA_HTTP_PORT: "8080"

jobs:
  compose-check:
    name: Verify production stack
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build API image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile.api
          push: false
          load: true
          tags: cera-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build web image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile.web
          push: false
          load: true
          tags: cera-web:ci
          build-args: |
            VITE_API_URL=/api/v1
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create CI environment
        run: |
          mkdir -p .ci

          cat > .ci/api.env <<'EOF'
          NODE_ENV=production
          PORT=4000
          CLIENT_URL=http://127.0.0.1:8080

          MONGODB_URI=mongodb://mongo:27017/cera_ci

          JWT_ACCESS_SECRET=ci-access-secret-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          REFRESH_TOKEN_SECRET=ci-refresh-secret-bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
          INVITATION_TOKEN_SECRET=ci-invitation-secret-cccccccccccccccccccccccccccc

          JWT_ISSUER=cera-api
          JWT_AUDIENCE=cera-web
          INVITATION_TTL_HOURS=72

          R2_ACCOUNT_ID=ci-account
          R2_ACCESS_KEY_ID=ci-access-key
          R2_SECRET_ACCESS_KEY=ci-secret-key
          R2_BUCKET_NAME=ci-bucket
          EOF

      - name: Validate Compose configuration
        run: |
          docker compose \
            -f compose.production.yml \
            -f .github/compose.ci.yml \
            config --quiet

      - name: Start production topology
        run: |
          docker compose \
            -f compose.production.yml \
            -f .github/compose.ci.yml \
            up -d \
            --no-build \
            --pull never \
            --wait \
            --wait-timeout 120

      - name: Verify web health endpoint
        run: |
          curl --fail --silent \
            http://127.0.0.1:8080/healthz

      - name: Verify Nginx to API routing
        run: |
          response="$(
            curl --fail --silent \
              http://127.0.0.1:8080/api/v1/health
          )"

          echo "$response"

          echo "$response" | grep -q '"success":true'

      - name: Verify React application
        run: |
          curl --fail --silent \
            http://127.0.0.1:8080/ \
            | grep -qi '<div id="root">'

      - name: Verify SPA routing
        run: |
          curl --fail --silent \
            http://127.0.0.1:8080/doctor/dashboard \
            | grep -qi '<div id="root">'

      - name: Verify API port is not published
        run: |
          published="$(
            docker compose \
              -f compose.production.yml \
              -f .github/compose.ci.yml \
              port api 4000 2>/dev/null || true
          )"

          if [ -n "$published" ]; then
            echo "API port 4000 is unexpectedly published:"
            echo "$published"
            exit 1
          fi

          echo "API port 4000 is private."

      - name: Show stack status
        if: always()
        run: |
          docker compose \
            -f compose.production.yml \
            -f .github/compose.ci.yml \
            ps || true

      - name: Show logs on failure
        if: failure()
        run: |
          docker compose \
            -f compose.production.yml \
            -f .github/compose.ci.yml \
            logs --no-color || true

      - name: Cleanup
        if: always()
        run: |
          docker compose \
            -f compose.production.yml \
            -f .github/compose.ci.yml \
            down -v \
            --remove-orphans || true

          rm -rf .ci
