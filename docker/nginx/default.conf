location /api/ {
    proxy_pass http://api:4000;

    proxy_http_version 1.1;

    proxy_set_header Host $host;

    # Nginx is the only public reverse proxy in this topology.
    # Overwrite forwarded values instead of trusting values supplied
    # by an internet client.
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_connect_timeout 10s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    # Application attachment limit is 10 MiB.
    # Allow small multipart overhead here; Multer remains authoritative.
    client_max_body_size 12m;
}